# Local development defaults only. Never use these values outside your machine.
spring:
  datasource:
    password: ${DB_PASSWORD:smart_retail}
  flyway:
    # db/seed adds sample categories, products and banners for local testing.
    locations: classpath:db/migration,classpath:db/seed
    # The seed scripts are V100 and up, so a new V2 arrives "behind" them on an existing dev database.
    out-of-order: true

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc21hcnQtcmV0YWlsLWp3dC1zZWNyZXQta2V5LWNoYW5nZS1tZQ==}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8081}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@smartretail.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
