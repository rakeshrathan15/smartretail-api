spring:
  application:
    name: smart-retail-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_retail}
    username: ${DB_USERNAME:smart_retail}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  # Lets requests in progress finish when the server is stopped for a new release.
  shutdown: graceful

logging:
  structured:
    format:
      # One JSON object per line, for Logstash or any log platform. Dev turns this off.
      console: logstash

management:
  tracing:
    sampling:
      # Every request gets a trace id in the logs. Lower this when a tracing backend is added.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Base64-encoded HMAC key, at least 256 bits. Must be set in every non-dev environment.
    secret: ${JWT_SECRET:}
    issuer: smart-retail
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    local-dir: ${STORAGE_DIR:uploads}
    private-dir: ${PRIVATE_STORAGE_DIR:private-uploads}
    public-path: /uploads
  bootstrap-admin:
    # When set and no admin exists yet, an admin account is created on startup.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
